name: Workflow for the project
on: push

jobs:
  build:
    name: push action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup network
        run: |
          docker network create --driver bridge SoftwareMethods1
          docker pull mongo
          docker run -d --name Mongo-DB-Server --network SoftwareMethods1 mongo
      - name: Compile with Maven
        run: mvn compile
      - name: Build Docker Image
        run: docker build -t devopsimage .
      - name: Run image
        run: docker run --name devopscontainer -d devopsimage
      - name: view logs
        run: docker logs -f devopscontainer
