name: Workflow for the project
on: push

jobs:
  build:
    name: push action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compile with Maven
        run: mvn compile
      - name: Build docker compose
        run: docker compose build
      - name: Run docker compose
        run: docker compose up --abort-on-container-exit --name sem-cw-container
      - name: view logs
        run: docker logs -f sem-cw-container
      - name: Unit Tests
        run: |
          docker compose up -d
          mvn test
          docker compose down
